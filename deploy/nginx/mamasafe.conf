# ═══════════════════════════════════════════════════════════════
# MamaSafe — Nginx reverse proxy (host level)
#
# Template. Rendered by deploy/scripts/deploy.sh using envsubst, then
# installed to /etc/nginx/sites-available/mamasafe.
#
# Requires TLS certs at /etc/letsencrypt/live/${DOMAIN}/ — obtain them
# first with deploy/scripts/certbot-init.sh (webroot mode), then install
# this file and reload Nginx.
#
# Upstreams are the Docker containers, all bound to 127.0.0.1:
#   frontend 127.0.0.1:8080   React app (SPA)
#   backend  127.0.0.1:8000   FastAPI  (routes under /api/v1)
#   whatsapp 127.0.0.1:3001   NOT exposed externally
# ═══════════════════════════════════════════════════════════════

upstream mamasafe_frontend { server 127.0.0.1:8080; }
upstream mamasafe_backend  { server 127.0.0.1:8000; }

# ── HTTP → HTTPS redirect ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN} ${API_DOMAIN} ${DOWNLOAD_DOMAIN};

    # Webroot for Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: web app (root + www) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # gzip for text assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # React app (SPA) → frontend container
    location / {
        proxy_pass http://mamasafe_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # FastAPI backend → backend container (path preserved: /api/v1/...)
    location /api/ {
        proxy_pass http://mamasafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ── HTTPS: API subdomain ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${API_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://mamasafe_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# ── HTTPS: downloads subdomain (APK host) ──────────────────────
# Drop the APK file into /var/www/downloads on the server.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOWNLOAD_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/downloads;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location ~* \.apk$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
